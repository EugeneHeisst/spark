[workspace]
resolver = "2"
members = ["crates/spark-protocol", "crates/spark-service", "crates/spark-ui"]
default-members = ["crates/spark-protocol", "crates/spark-service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
spark-protocol = { path = "crates/spark-protocol" }

[profile.release]
lto = "thin"
strip = true

[profile.release.package.spark-ui]
strip = "debuginfo"
