name: Build and verify Spark
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux desktop libraries (bounded APT)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          # Use preinstalled desktop capabilities first; avoid APT when complete.
          desktop_libraries=$(ldconfig -p)
          packages=()
          need_library() { if [[ "$desktop_libraries" != *"$1"* ]]; then packages+=("$2"); fi; }
          need_library libgtk-3.so.0 libgtk-3-0t64
          need_library libnss3.so libnss3
          need_library libasound.so.2 libasound2t64
          need_library libgbm.so.1 libgbm1
          need_library libXss.so.1 libxss1
          need_library libXtst.so.6 libxtst6
          if ! command -v xvfb-run >/dev/null || ! command -v Xvfb >/dev/null; then packages+=(xvfb); fi
          if ! command -v xauth >/dev/null; then packages+=(xauth); fi
          if ! command -v dbus-run-session >/dev/null; then packages+=(dbus-daemon); fi
          if ! command -v openbox >/dev/null && ! command -v kwin_x11 >/dev/null; then packages+=(openbox); fi
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo 'Desktop libraries, Xvfb and window manager are already available.'
            exit 0
          fi
          # Bound all network operations and use official Ubuntu HTTPS mirrors.
          cat > "${RUNNER_TEMP}/spark-ubuntu.list" <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          SOURCES
          apt_options=(-o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Languages=none -o APT::Update::Error-Mode=any -o "Dir::Etc::sourcelist=${RUNNER_TEMP}/spark-ubuntu.list" -o Dir::Etc::sourceparts=-)
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=10s 120s apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install --no-install-recommends -y "${packages[@]}"
      - run: npm ci --no-audit --no-fund
      - name: Update validation and installation tests
        run: node --test tests/update/*.test.cjs
      - name: Rust tests (real sockets and disk)
        run: cargo test --locked -p spark-protocol -p spark-service
      - name: Rust source checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p spark-protocol -p spark-service --all-targets -- -D warnings
      - name: Rust WebAssembly type check
        run: cargo check --locked -p spark-ui --target wasm32-unknown-unknown
      - name: WebAssembly bindings compiler
        run: python scripts/install-bindgen.py
      - run: npm run build
      - name: Linux packages
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Windows installer and portable package
        if: runner.os == 'Windows'
        run: npm run package:win
      - name: Linux desktop clients and packaged application
        if: runner.os == 'Linux'
        run: npm run test:e2e:linux
        env:
          SPARK_PACKAGED_BINARY: ${{ github.workspace }}/dist/linux-unpacked/spark-lan
      - name: Windows desktop clients and packaged application
        if: runner.os == 'Windows'
        run: npm run test:e2e
        env:
          SPARK_SKIP_SCREEN_TEST: '1'
          SPARK_PACKAGED_BINARY: ${{ github.workspace }}\dist\win-unpacked\Spark.exe
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: spark-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ runner.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: spark-*
          path: release-assets
          merge-multiple: true
      - name: Validate version and generate update metadata after both platform jobs pass
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          node scripts/update-manifest.mjs release-assets
      - name: Stage verified packages as a draft
        shell: bash
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
            gh release edit "$RELEASE_TAG" --draft=true --target "$GITHUB_SHA" --title "Spark $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Spark $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Verify uploaded content and publish
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/spark-release.json"
          python3 <<'PYVERIFY'
          import json, os
          from pathlib import Path
          local = {p.name: p.stat().st_size for p in Path("release-assets").iterdir() if p.is_file()}
          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "spark-release.json").read_text())
          uploaded = {a["name"]: a["size"] for a in release["assets"]}
          if not release["isDraft"] or len(release["assets"]) != 5 or uploaded != local:
              raise SystemExit("Draft must contain exactly three packages, spark-update.json and SHA256SUMS with matching sizes")
          PYVERIFY
          mkdir "$RUNNER_TEMP/spark-release-download"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/spark-release-download"
          cmp release-assets/SHA256SUMS "$RUNNER_TEMP/spark-release-download/SHA256SUMS"
          (cd "$RUNNER_TEMP/spark-release-download" && sha256sum -c SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,isDraft
