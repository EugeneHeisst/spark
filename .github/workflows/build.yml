name: Verify Spark Linux fallback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Rust tests (real sockets and disk)
        run: cargo test --locked -p spark-protocol -p spark-service
      - name: Rust source checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p spark-protocol -p spark-service --all-targets -- -D warnings
      - name: Rust WebAssembly type check
        run: cargo check --locked -p spark-ui --target wasm32-unknown-unknown
      - name: Linux desktop libraries (bounded APT)
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          packages=(libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 xvfb openbox dbus-x11)
          # Hosted images already contain most desktop libraries and package
          # indexes. Avoid refreshing unrelated repositories on the fast path.
          if ! sudo timeout --kill-after=10s 120s apt-get "${apt_options[@]}" install --no-install-recommends -y "${packages[@]}"; then
            sudo timeout --kill-after=10s 120s apt-get "${apt_options[@]}" update
            sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install --no-install-recommends -y "${packages[@]}"
          fi
      - run: npm ci --no-audit --no-fund
      - name: WebAssembly bindings compiler
        run: python scripts/install-bindgen.py
      - run: npm run build
      - name: Linux packages
        run: npm run package:linux
      - name: Linux desktop clients and packaged application
        run: npm run test:e2e:linux
        env:
          SPARK_PACKAGED_BINARY: ${{ github.workspace }}/dist/linux-unpacked/spark-lan
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: spark-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ runner.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
